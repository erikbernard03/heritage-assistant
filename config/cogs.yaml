# Heritage Ring — Tabella costi (COGS) per il calcolo del net profit
# Tutti i valori in USD. Il match prodotto->costo avviene per HANDLE Shopify (preferito) o per titolo.
# REGOLA DI SICUREZZA: qualsiasi SKU/prodotto non elencato, o con costo $0, usa default_cogs = 3.
default_cogs: 3          # fallback per SKU sconosciuti o costo $0
shipping_per_order: 7    # USD, flat per ordine
payment_fee_rate: 0.075  # 7.5% sul revenue
# ---- Costi fissi mensili (USD) ----
# total = valore autoritativo (personale + software). Lo split sotto è indicativo.
fixed_costs_monthly:
  personnel: 3257
  software: 2411
  total: 6117
include_fixed_costs_in_net_profit: true   # se true, alloca total/30 al giorno
# ---- Regole per FAMIGLIA di prodotto (match per parole chiave) ----
# Ordinate: la PRIMA regola che combacia vince. Match sui TOKEN di handle+titolo
# (slugificati): coprono tutte le varianti (round/square/engraved/raised/black paint)
# senza elencare ogni handle. Valutate DOPO il match per handle/titolo esatto e PRIMA
# del default ($3). I free/B2G1F prendono comunque il COGS pieno (per quantità).
title_rules:
  - keywords: [personalized, coat, arms, necklace]  # Personalized Coat of Arms Necklace
    cogs: 8
  - keywords: [personalized, coat, arms, bracelet]  # Personalized Coat of Arms Bracelet
    cogs: 8
  - keywords: [personalized, sterling, signet]      # Sterling Silver Signet (tutte le varianti)
    cogs: 48
  - keywords: [square, signet]                      # Square gold/white-gold signets (PRIMA del generico)
    cogs: 17.21
  - keywords: [personalized, signet]                # Round gold/white-gold signets (ogni variante)
    cogs: 12
  - keywords: [ring, size, adjuster]                # Ring Size Adjuster Kit
    cogs: 1

# ---- Match per TITOLO ESATTO (case-insensitive, titolo Shopify completo) ----
# Ha PRIORITÀ sulle title_rules per FAMIGLIA: un titolo elencato qui NON deve mai
# cadere nella famiglia generica (es. "Tutto Passa Signet Ring (PRE-ORDER)" NON deve
# prendere una regola signet; "Fleur-de-Lis Tile Bracelet (PRE-ORDER)" NON deve prendere
# la famiglia Fleur-de-Lis). Costo per unità, USD, uguale per ogni variante (colore/taglia).
# Vale per ENTRAMBI gli store (resolver condiviso).
exact_titles:
  # Necklaces — $3.50
  "Compass Necklace (PRE-ORDER)": 3.50
  "Onyx Crown Necklace (PRE-ORDER)": 3.50
  "Hammered Cross Necklace (PRE-ORDER)": 3.50
  "Turquoise Signet Necklace (PRE-ORDER)": 3.50
  "Equestrian Medallion Necklace (PRE-ORDER)": 3.50
  "Tutto Passa Necklace (PRE-ORDER)": 3.50
  "Con Calma Necklace (PRE-ORDER)": 3.50
  # Bracelets — $3.00
  "Fleur-de-Lis Tile Bracelet (PRE-ORDER)": 3.00
  "Gold Hook Bracelet (PRE-ORDER)": 3.00
  "Navy Leather Cuff (PRE-ORDER)": 3.00
  "Black Cord Cuff (PRE-ORDER)": 3.00
  "Navy Mariner Bracelet (PRE-ORDER)": 3.00
  "Black Shackle Bracelet (PRE-ORDER)": 3.00
  "Regatta Bracelet (PRE-ORDER)": 3.00
  "Rope Bracelet (PRE-ORDER)": 3.00
  "Cuban Bracelet (PRE-ORDER)": 3.00
  # Rings — $3.00
  "Tutto Passa Signet Ring (PRE-ORDER)": 3.00
  "Dolce Vita Signet Ring (PRE-ORDER)": 3.00
  "Fleur-de-Lis Signet Ring (PRE-ORDER)": 3.00
  "Anchor Signet Ring (PRE-ORDER)": 3.00
  # Cufflinks — $3.00
  "Sea Turtle Cufflinks": 3.00
  "Lobster Cufflinks": 3.00
  "Black Onyx Cufflinks": 3.00
  "Sailboat Cufflinks": 3.00
  "Black Striped Cufflinks": 3.00
  "Race Car Cufflinks": 3.00
  "Four Aces Cufflinks": 3.00
  "Airplane Cufflinks": 3.00
  # Personalized cufflinks — $15.00
  "Personalized Cufflinks": 15.00

# ---- Override per HANDLE esatto (priorità massima sulle regole) ----
custom_products:
  personalized-sterling-silver-signet-ring: 48
  personalized-wooden-ring-box: 3
# ---- Regola per collection: tutto ciò che sta in queste collection = $3 ----
collection_cogs:
  classic-rings: 3
  bracelets: 3
# ---- Elenco esplicito (ridondante ma utile come riferimento/controllo) ----
# Classic Rings (13) - tutti $3
classic_rings:
  carnelian-signet-ring: 3
  tiger-s-eye-signet-ring-copy: 3        # Tiger's Eye Square Signet Ring
  green-stone-signet-ring: 3
  lapis-lazuli-signet-ring: 3
  turquoise-blue-signet-ring: 3
  tiger-s-eye-signet-ring: 3
  black-onyx-signet-ring: 3
  diamond-inset-ring: 3
  minimal-oval-signet-ring: 3
  black-stone-square-signet-ring: 3
  oval-carnelian-pinky-ring: 3
  oval-pinky-ring: 3                      # Oval Onyx Pinky Ring
  cross-texture-ring: 3
# Bracelets (11) - tutti $3
bracelets:
