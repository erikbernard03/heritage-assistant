# Configurazione Shopify CLI per l'app (Dev Dashboard).
# Dichiara gli Admin API scopes e la API version. Il client_id NON è segreto
# (è un identificatore pubblico); il client_secret invece resta SOLO nel .env.
#
# Comandi (sulla TUA macchina, dove il login via browser funziona):
#   npm install -g @shopify/cli@latest
#   shopify app config link     # collega questo file all'app del Dev Dashboard
#   shopify app deploy          # rilascia gli scope dichiarati qui
# Poi installa l'app sullo store (vedi link di installazione fornito in chat).

client_id = "f762afa33f267afaa3fc1b8f43789652"
name = "heritage-assistant"
application_url = "https://fx8bnw-ix.myshopify.com"
embedded = false

[access_scopes]
# SOLO lettura.
# - read_reports:    CVR di negozio + sessioni/visitatori reali (ShopifyQL: FROM sessions).
# - read_all_orders: ordini OLTRE i 60 giorni (senza, l'API restituisce solo gli ultimi
#                    60 giorni -> il backfill di date più vecchie tornava a 0 ordini).
#                    Va SEMPRE insieme a read_orders (lo estende, non lo sostituisce).
#                    App custom/single-store: nessuna richiesta speciale a Shopify, basta
#                    ri-approvare all'installazione (le app pubbliche/distribuite invece
#                    devono compilare il form di richiesta read_all_orders).
scopes = "read_orders,read_all_orders,read_products,read_fulfillments,read_inventory,read_reports"

[auth]
redirect_urls = [
  "https://fx8bnw-ix.myshopify.com/admin",
  "https://fx8bnw-ix.myshopify.com/admin/apps"
]

[webhooks]
api_version = "2026-04"
